name: beslet_app
description: Beslet (ብስለት) - Spiritual Growth & Life Discipline System
publish_to: 'none'
version: 1.7.2+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  go_router: ^14.8.1
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  http: ^1.2.0
  flutter_tts: ^4.2.2
  audioplayers: ^6.1.0

hooks:
  user_defines:
    sqlite3:
      source: system

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/data/
  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic.ttf
        - asset: assets/fonts/NotoSansEthiopic.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
        - asset: assets/fonts/Inter.ttf
          weight: 700
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
        - asset: assets/fonts/CormorantGaramond.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Untitled design.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/images/Untitled design.png"
  min_sdk_android: 21
  remove_alpha_ios: true
